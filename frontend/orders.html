<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — ShopEase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/index.html" class="nav-logo">Shop<span>Ease</span></a>
    <div class="nav-links">
      <a href="/index.html">🏠 Home</a>
      <a href="/cart.html" class="cart-link">
        🛒 Cart <span class="cart-badge" id="cart-badge">0</span>
      </a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="container">
  <h2 style="margin-bottom:1.5rem;">📦 My Orders</h2>
  <div id="loading" class="loading"><div class="spinner"></div>Loading orders...</div>
  <div id="orders-list"></div>
</div>

<script>
  const API_URL = 'https://shopease-backend-7hdy.onrender.com/api';
  const getToken = () => localStorage.getItem('token');
  const getCart  = () => { try { return JSON.parse(localStorage.getItem('cart')) || []; } catch(e){ return []; } };

  // Redirect if not logged in
  if (!getToken()) window.location.href = '/login.html';

  function updateCartBadge() {
    const count = getCart().reduce((a, i) => a + i.quantity, 0);
    const badge = document.getElementById('cart-badge');
    if (badge) { badge.textContent = count; badge.style.display = count > 0 ? 'flex' : 'none'; }
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/login.html';
  }

  const statusClass = {
    'Pending':    'status-pending',
    'Processing': 'status-processing',
    'Shipped':    'status-shipped',
    'Delivered':  'status-delivered',
    'Cancelled':  'status-cancelled'
  };

  async function loadOrders() {
    try {
      const res    = await fetch(`${API_URL}/orders/myorders`, {
        headers: { 'Authorization': `Bearer ${getToken()}` }
      });
      const orders = await res.json();
      if (!res.ok) throw new Error(orders.message);

      document.getElementById('loading').style.display = 'none';
      const list = document.getElementById('orders-list');

      if (orders.length === 0) {
        list.innerHTML = `
          <div style="text-align:center;padding:3rem;background:white;border-radius:12px;
            box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);">
            <div style="font-size:3rem;margin-bottom:1rem;">📦</div>
            <h3>No orders yet</h3>
            <p style="color:#6b7280;margin:0.5rem 0 1.5rem;">Start shopping to see your orders here</p>
            <a href="/index.html" class="btn btn-primary">Shop Now</a>
          </div>`;
        return;
      }

      list.innerHTML = orders.map(order => `
        <div class="order-card">
          <div class="order-header">
            <div>
              <strong>Order #${order._id.slice(-8).toUpperCase()}</strong>
              <div style="font-size:0.85rem;color:#6b7280;margin-top:0.2rem;">
                ${new Date(order.createdAt).toLocaleDateString('en-IN', {
                  day: 'numeric', month: 'short', year: 'numeric'
                })}
              </div>
            </div>
            <span class="status-badge ${statusClass[order.status] || 'status-pending'}">
              ${order.status}
            </span>
          </div>

          <div style="margin-bottom:1rem;">
            ${order.orderItems.map(item => `
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0;
                border-bottom:1px solid #f3f4f6;">
                <img src="${item.image}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;"
                  onerror="this.src='https://via.placeholder.com/48'">
                <div style="flex:1;font-size:0.9rem;font-weight:600;">${item.name}</div>
                <div style="font-size:0.85rem;color:#6b7280;">x${item.quantity}</div>
                <div style="font-weight:700;color:#2563eb;">
                  ₹${(item.price * item.quantity).toLocaleString('en-IN')}
                </div>
              </div>
            `).join('')}
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;
            flex-wrap:wrap;gap:0.5rem;">
            <div style="font-size:0.85rem;color:#6b7280;">
              📍 ${order.shippingAddress.city}, ${order.shippingAddress.country}
              &nbsp;|&nbsp; 💳 ${order.paymentMethod}
            </div>
            <div style="font-weight:800;font-size:1.1rem;color:#2563eb;">
              Total: ₹${order.totalPrice.toLocaleString('en-IN')}
            </div>
          </div>
        </div>
      `).join('');
    } catch (err) {
      document.getElementById('loading').innerHTML =
        `<div class="alert alert-error">❌ ${err.message}</div>`;
    }
  }

  updateCartBadge();
  loadOrders();
</script>
</body>
</html>
