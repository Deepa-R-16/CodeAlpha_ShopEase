<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopEase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/index.html" class="nav-logo">Shop<span>Ease</span></a>
    <div class="nav-links">
      <a href="/index.html">← Back to Shop</a>
    </div>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h2>👋 Welcome Back</h2>
    <p>Sign in to your ShopEase account</p>
    <div id="alert"></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="Your password">
    </div>

    <button class="btn btn-primary btn-full" id="login-btn" onclick="login()">
      Sign In →
    </button>
    <p style="text-align:center;margin-top:1rem;color:#6b7280;">
      Don't have an account?
      <a href="/register.html" style="color:#2563eb;font-weight:600;">Register</a>
    </p>
  </div>
</div>

<script>
  const API_URL = 'https://shopease-backend-7hdy.onrender.com/api';
  const getToken = () => localStorage.getItem('token');

  if (getToken()) window.location.href = '/index.html';

  document.getElementById('password').addEventListener('keyup', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertDiv = document.getElementById('alert');
    const btn      = document.getElementById('login-btn');

    if (!email || !password) {
      alertDiv.innerHTML = '<div class="alert alert-error">Please fill in all fields.</div>';
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Signing in...';

    try {
      const res  = await fetch(`${API_URL}/auth/login`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify({
        _id: data._id, name: data.name, email: data.email, role: data.role
      }));
      window.location.href = '/index.html';
    } catch (err) {
      alertDiv.innerHTML  = `<div class="alert alert-error">❌ ${err.message}</div>`;
      btn.disabled        = false;
      btn.textContent     = 'Sign In →';
    }
  }
</script>
</body>
</html>
