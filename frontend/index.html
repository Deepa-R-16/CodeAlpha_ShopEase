<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase — Home</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/index.html" class="nav-logo">Shop<span>Ease</span></a>
    <div class="nav-links">
      <a href="/index.html">🏠 Home</a>
      <a href="/cart.html" class="cart-link">
        🛒 Cart
        <span class="cart-badge" id="cart-badge">0</span>
      </a>
      <span id="auth-links"></span>
    </div>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1>🛒 Welcome to ShopEase</h1>
    <p>Discover amazing products at unbeatable prices</p>
    <a href="#products" class="btn btn-secondary">Shop Now →</a>
  </div>

  <div class="search-section">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 Search products...">
    <select id="category-filter" class="filter-select">
      <option value="">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Clothing">Clothing</option>
      <option value="Books">Books</option>
      <option value="Home">Home</option>
      <option value="Sports">Sports</option>
    </select>
    <select id="sort-filter" class="filter-select">
      <option value="">Sort By</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
    </select>
    <button class="btn btn-primary" onclick="loadProducts()">Search</button>
  </div>

  <div id="products">
    <div id="loading" class="loading">
      <div class="spinner"></div>Loading products...
    </div>
    <div id="products-grid" class="products-grid" style="display:none;"></div>
    <div id="pagination" class="pagination"></div>
  </div>
</div>

<script>
  const API_URL = 'https://shopease-backend-7hdy.onrender.com/api';
  const getToken = () => localStorage.getItem('token');
  const getUser  = () => { try { return JSON.parse(localStorage.getItem('user')); } catch(e){ return null; } };
  const getCart  = () => { try { return JSON.parse(localStorage.getItem('cart')) || []; } catch(e){ return []; } };

  function updateCartBadge() {
    const count = getCart().reduce((a, i) => a + i.quantity, 0);
    const badge = document.getElementById('cart-badge');
    if (badge) { badge.textContent = count; badge.style.display = count > 0 ? 'flex' : 'none'; }
  }

  function setupNav() {
    const user      = getUser();
    const authLinks = document.getElementById('auth-links');
    if (user) {
      authLinks.innerHTML = `
        <a href="/orders.html">📦 Orders</a>
        <span style="padding:0.5rem;color:#6b7280;font-weight:500;">Hi, ${user.name.split(' ')[0]}!</span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      `;
    } else {
      authLinks.innerHTML = `
        <a href="/login.html">Login</a>
        <a href="/register.html" style="background:#2563eb;color:white;padding:0.5rem 1rem;
          border-radius:8px;font-weight:600;">Register</a>
      `;
    }
    updateCartBadge();
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/index.html';
  }

  function getStars(rating) {
    const full = Math.floor(rating);
    return '★'.repeat(full) + '☆'.repeat(5 - full);
  }

  async function loadProducts(page = 1) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('products-grid').style.display = 'none';
    document.getElementById('pagination').innerHTML = '';

    try {
      const keyword  = document.getElementById('search-input').value;
      const category = document.getElementById('category-filter').value;
      const sort     = document.getElementById('sort-filter').value;

      let url = `/api/products?page=${page}`;
      if (keyword)  url += `&keyword=${encodeURIComponent(keyword)}`;
      if (category) url += `&category=${encodeURIComponent(category)}`;

      const res  = await fetch(url);
      const data = await res.json();
      let products = data.products || [];

      if (sort === 'price_asc')  products.sort((a, b) => a.price - b.price);
      if (sort === 'price_desc') products.sort((a, b) => b.price - a.price);

      const grid = document.getElementById('products-grid');
      if (products.length === 0) {
        grid.innerHTML = `<p style="text-align:center;color:#6b7280;padding:3rem;grid-column:1/-1;">
          No products found.</p>`;
      } else {
        grid.innerHTML = products.map(p => `
          <div class="product-card" onclick="window.location='/product.html?id=${p._id}'"
            style="cursor:pointer;">
            <img src="${p.image}" alt="${p.name}"
              onerror="this.src='https://via.placeholder.com/400x300'">
            <div class="product-info">
              <div class="product-category">${p.category}</div>
              <div class="product-name">${p.name}</div>
              <div class="product-rating">
                <span class="stars">${getStars(p.rating)}</span>
                <span class="rating-count">(${p.numReviews})</span>
              </div>
              <div class="product-footer">
                <div class="product-price">${p.price.toLocaleString('en-IN')}</div>
                <span class="stock-badge ${p.stock > 0 ? 'in-stock' : 'out-stock'}">
                  ${p.stock > 0 ? 'In Stock' : 'Out of Stock'}
                </span>
              </div>
            </div>
          </div>
        `).join('');
      }

      grid.style.display = 'grid';
      document.getElementById('loading').style.display = 'none';

      if (data.pages > 1) {
        const pg = document.getElementById('pagination');
        for (let i = 1; i <= data.pages; i++) {
          pg.innerHTML += `<button class="page-btn ${i === page ? 'active' : ''}"
            onclick="loadProducts(${i})">${i}</button>`;
        }
      }
    } catch (err) {
      document.getElementById('loading').innerHTML =
        `<div class="alert alert-error">Failed to load products: ${err.message}</div>`;
    }
  }

  document.getElementById('search-input').addEventListener('keyup', e => {
    if (e.key === 'Enter') loadProducts();
  });

  setupNav();
  loadProducts();
</script>
</body>
</html>
